name = "mercado-previsoes-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "production"
DEFAULT_PLATFORM_OPERATIONAL_COST_PCT = 10
DEFAULT_CREATOR_REWARD_PCT = 20
DEFAULT_WINNERS_PCT = 70

# Secrets configurados via `wrangler secret put`:
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# YOUTUBE_API_KEY
# SPOTIFY_CLIENT_ID
# SPOTIFY_CLIENT_SECRET
